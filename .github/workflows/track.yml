name: Track prices

on:
  schedule:
    - cron: "17 * * * *"   # hourly: handles Telegram commands; products re-checked every CHECK_INTERVAL_HOURS
  workflow_dispatch:
    inputs:
      force:
        description: "Check every product now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CHECK_INTERVAL_HOURS: ${{ vars.CHECK_INTERVAL_HOURS || '3' }}
          MIN_DROP_PCT: ${{ vars.MIN_DROP_PCT || '1' }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then python -m tracker run --force; else python -m tracker run; fi

      - name: Save data and dashboard
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update prices"
          git pull --rebase --autostash
          git push
